<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Development Activity and Daily Work Consistency">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGradU" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1019"/>
      <stop offset="50%" stop-color="#131625"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanGradU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purpleGradU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="orbitGradU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="podGradU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f111d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="podHeroGradU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2440" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101322" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Filters for Futuristic Glow Effects -->
    <filter id="glowCyanU" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPurpleU" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadowU" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Circular Path for Rotating Text (Radius: 32px, Circumference ~201px) -->
    <path id="orbitPathU" d="M 0, -32 a 32,32 0 1,1 0,64 a 32,32 0 1,1 0,-64"/>

    <style>
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes beaconPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.2); }
      }
      .spin-text-anim {
        transform-origin: 0px 0px;
        animation: spinCW 14s linear infinite;
      }
      .spin-dash-anim {
        transform-origin: 0px 0px;
        animation: spinCCW 22s linear infinite;
      }
      .beacon-dot-anim {
        transform-origin: 0px 0px;
        animation: beaconPulse 2s ease-in-out infinite;
      }
      .f-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      .f-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Main Card Body -->
  <rect width="495" height="195" rx="12" fill="url(#bgGradU)" stroke="#222842" stroke-width="1.2" filter="url(#cardShadowU)"/>

  <!-- Futuristic Corner Cyber-Reticles -->
  <path d="M 12 22 L 12 12 L 22 12" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 483 22 L 483 12 L 473 12" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 12 173 L 12 183 L 22 183" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 483 173 L 483 183 L 473 183" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-7" width="3" height="12" rx="1.5" fill="#00f5ff" filter="url(#glowCyanU)"/>
    <text x="12" y="3" fill="#70a5fd" class="f-mono" font-size="13" font-weight="700" letter-spacing="1">
      DAILY WORK CONSISTENCY &amp; ACTIVITY
    </text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(471, 24)" text-anchor="end">
    <rect x="-132" y="-12" width="132" height="20" rx="10" fill="#0d101a" stroke="#252c4b" stroke-width="1.2"/>
    <g transform="translate(-120, -2)">
      <circle class="beacon-dot-anim" cx="0" cy="0" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="6" fill="#10b981" opacity="0.2"/>
    </g>
    <text x="-12" y="1.5" fill="#10b981" class="f-mono" font-size="9" font-weight="700" letter-spacing="0.8">
      ACTIVE TODAY (24/7)
    </text>
  </g>

  <!-- ==================== LEFT POD: Total Contributions ==================== -->
  <g transform="translate(24, 50)">
    <!-- Pod Glass Box -->
    <rect width="132" height="128" rx="8" fill="url(#podGradU)" stroke="#222842" stroke-width="1"/>
    <path d="M 8 10 L 14 10 M 8 13 L 18 13" stroke="#00f5ff" stroke-width="1" opacity="0.6"/>

    <g transform="translate(66, 26)" text-anchor="middle">
      <!-- Icon: Code Commits & Output -->
      <circle cx="0" cy="0" r="13" fill="#111422" stroke="#2b3252" stroke-width="1"/>
      <path d="M -5 -3 L 0 -6 L 5 -3 L 0 0 Z M -5 0 L 0 3 L 5 0 M -5 3 L 0 6 L 5 3" fill="none" stroke="#38bdf8" stroke-width="1.2"/>

      <!-- Big Neon Value -->
      <text x="0" y="37" fill="url(#cyanGradU)" class="f-mono" font-size="22" font-weight="800" filter="url(#glowCyanU)">
        15,556
      </text>

      <!-- Label for HR -->
      <text x="0" y="54" fill="#e2e8f0" class="f-sans" font-size="10.5" font-weight="700" letter-spacing="0.3">
        Total Contributions
      </text>

      <!-- Subtext -->
      <text x="0" y="69" fill="#94a3b8" class="f-sans" font-size="9" font-weight="500">
        Commits, PRs &amp; Code
      </text>

      <!-- Date Range Tag -->
      <rect x="-50" y="80" width="100" height="16" rx="8" fill="#0d0e17" stroke="#222842" stroke-width="1"/>
      <text x="0" y="91.5" fill="#64748b" class="f-mono" font-size="8" font-weight="600" letter-spacing="0.5">
        SINCE APR 2025
      </text>
    </g>
  </g>

  <!-- ==================== MIDDLE POD: Hero Orbit Gauge (Current Streak) ==================== -->
  <g transform="translate(170, 50)">
    <!-- Pod Glass Box with Glowing Accent Border -->
    <rect width="155" height="128" rx="8" fill="url(#podHeroGradU)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.3"/>

    <!-- Orbital System Center at (77.5, 47) -->
    <g transform="translate(77.5, 47)">
      <!-- Outer Orbit Ring -->
      <circle cx="0" cy="0" r="37" stroke="#161a2b" stroke-width="2" fill="#0b0d16"/>
      <circle cx="0" cy="0" r="37" stroke="url(#orbitGradU)" stroke-width="1.5" fill="none" opacity="0.65"/>

      <!-- Counter-rotating Dashed Tech Orbital -->
      <g class="spin-dash-anim">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="34.5" stroke="#00f5ff" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.5"/>
      </g>

      <!-- Rotating Typography Ring (Short, Elegant, Readable) -->
      <g class="spin-text-anim">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="5.8" font-weight="700" fill="#00f5ff" letter-spacing="1.4" opacity="0.95">
          <textPath href="#orbitPathU" xlink:href="#orbitPathU" startOffset="0%">
            • DAILY CODING • UNBROKEN STREAK • 
          </textPath>
        </text>
      </g>

      <!-- Inner Core: Big Clean Number (NO overlapping text!) -->
      <circle cx="0" cy="0" r="22" fill="#111422" stroke="url(#cyanGradU)" stroke-width="1.8" filter="url(#glowCyanU)"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" class="f-mono" font-size="22" font-weight="900">
        43
      </text>
    </g>

    <!-- Labels Below the Circle (With Perfect Clean Breathing Room) -->
    <g transform="translate(77.5, 96)" text-anchor="middle">
      <text x="0" y="7" fill="#00f5ff" class="f-mono" font-size="10.5" font-weight="800" letter-spacing="0.8">
        42 DAYS IN A ROW
      </text>
      <text x="0" y="19" fill="#94a3b8" class="f-sans" font-size="9" font-weight="600">
        Current Streak • Oct 3 - Nov 14
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT POD: Longest Streak Record ==================== -->
  <g transform="translate(339, 50)">
    <!-- Pod Glass Box -->
    <rect width="132" height="128" rx="8" fill="url(#podGradU)" stroke="#222842" stroke-width="1"/>
    <path d="M 124 10 L 118 10 M 124 13 L 114 13" stroke="#e879f9" stroke-width="1" opacity="0.6"/>

    <g transform="translate(66, 26)" text-anchor="middle">
      <!-- Icon: Trophy / Peak Zenith -->
      <circle cx="0" cy="0" r="13" fill="#111422" stroke="#2b3252" stroke-width="1"/>
      <path d="M -4 -4 L 4 -4 L 2.5 1 C 1.5 3 -1.5 3 -2.5 1 Z M 0 2 L 0 5 M -3 5 L 3 5" fill="none" stroke="#e0af68" stroke-width="1.2"/>

      <!-- Big Neon Value -->
      <text x="0" y="37" fill="url(#purpleGradU)" class="f-mono" font-size="22" font-weight="800" filter="url(#glowPurpleU)">
        43
      </text>

      <!-- Label for HR -->
      <text x="0" y="54" fill="#e2e8f0" class="f-sans" font-size="10.5" font-weight="700" letter-spacing="0.3">
        Longest Streak
      </text>

      <!-- Subtext -->
      <text x="0" y="69" fill="#94a3b8" class="f-sans" font-size="9" font-weight="500">
        Best Run Record
      </text>

      <!-- Date Range Tag -->
      <rect x="-50" y="80" width="100" height="16" rx="8" fill="#0d0e17" stroke="#222842" stroke-width="1"/>
      <text x="0" y="91.5" fill="#c084fc" class="f-mono" font-size="8" font-weight="700" letter-spacing="0.5">
        ★ OCT 3 - NOV 14
      </text>
    </g>
  </g>
</svg>