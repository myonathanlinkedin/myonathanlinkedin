<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Mateus Yonathan's GitHub Stats">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1019"/>
      <stop offset="50%" stop-color="#131625"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="cyanNumGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleNumGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Circular Path for Rotating Text (Radius: 33.5px, Circumference: ~210px) -->
    <path id="textCircle" d="M 0, -33.5 a 33.5,33.5 0 1,1 0,67 a 33.5,33.5 0 1,1 0,-67"/>

    <style>
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.08); opacity: 0.8; }
      }
      .spin-text {
        transform-origin: 0px 0px;
        animation: spinCW 14s linear infinite;
      }
      .spin-dashed {
        transform-origin: 0px 0px;
        animation: spinCCW 24s linear infinite;
      }
      .pulse-center {
        transform-origin: 0px 0px;
        animation: pulseCore 3s ease-in-out infinite;
      }
      .f-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
      }
      .f-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="495" height="195" rx="12" fill="url(#cardGrad)" stroke="#222842" stroke-width="1.2" filter="url(#shadow)"/>

  <!-- Futuristic Corner Cyber-Reticles -->
  <path d="M 12 22 L 12 12 L 22 12" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 483 22 L 483 12 L 473 12" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 12 173 L 12 183 L 22 183" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 483 173 L 483 183 L 473 183" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Title -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-7" width="3" height="12" rx="1.5" fill="#00f5ff" filter="url(#glowCyan)"/>
    <text x="12" y="3" fill="#70a5fd" class="f-mono" font-size="13" font-weight="700" letter-spacing="1">
      MATEUS YONATHAN // GITHUB STATS
    </text>
  </g>

  <!-- Metric Rows -->
  <g transform="translate(25, 62)">
    <!-- Stars -->
    <g transform="translate(0, 0)">
      <path d="M8 0L10.2 5.3L16 5.8L11.6 9.6L13 15.2L8 12.2L3 15.2L4.4 9.6L0 5.8L5.8 5.3L8 0Z" fill="#e0af68"/>
      <text x="25" y="12" fill="#e2e8f0" class="f-mono" font-size="12" font-weight="600">Total Stars Earned:</text>
      <text x="315" y="12" fill="#e0af68" class="f-mono" font-size="13" font-weight="700" text-anchor="end">11</text>
    </g>

    <!-- Commits -->
    <g transform="translate(0, 26)">
      <circle cx="8" cy="8" r="7" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <path d="M8 4V8L11 9.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="25" y="12" fill="#e2e8f0" class="f-mono" font-size="12" font-weight="600">Total Commits:</text>
      <text x="315" y="12" fill="url(#cyanNumGrad)" class="f-mono" font-size="13" font-weight="800" text-anchor="end" filter="url(#glowCyan)">6,785+</text>
    </g>

    <!-- PRs -->
    <g transform="translate(0, 52)">
      <circle cx="5" cy="5" r="2.5" stroke="#c084fc" stroke-width="1.5" fill="none"/>
      <circle cx="5" cy="11" r="2.5" stroke="#c084fc" stroke-width="1.5" fill="none"/>
      <circle cx="11" cy="8" r="2.5" stroke="#c084fc" stroke-width="1.5" fill="none"/>
      <path d="M5 7.5V8.5" stroke="#c084fc" stroke-width="1.5"/>
      <path d="M11 5.5C11 4 8 4 6 4" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>
      <text x="25" y="12" fill="#e2e8f0" class="f-mono" font-size="12" font-weight="600">Total PRs Merged &amp; Created:</text>
      <text x="315" y="12" fill="url(#purpleNumGrad)" class="f-mono" font-size="13" font-weight="800" text-anchor="end" filter="url(#glowPurple)">2,146</text>
    </g>

    <!-- Verified Modules -->
    <g transform="translate(0, 78)">
      <path d="M8 1L1 5L8 9L15 5L8 1Z" stroke="#34d399" stroke-width="1.5" fill="none"/>
      <path d="M1 9L8 13L15 9" stroke="#34d399" stroke-width="1.5" fill="none"/>
      <text x="25" y="12" fill="#e2e8f0" class="f-mono" font-size="12" font-weight="600">Verified Systems Modules:</text>
      <text x="315" y="12" fill="#34d399" class="f-mono" font-size="13" font-weight="800" text-anchor="end">307 (14 Langs)</text>
    </g>
  </g>
  <!-- Continuous Development Animated Orbit Badge -->
  <g transform="translate(412, 105)">
    <!-- Outer Orbit Ring with subtle glow -->
    <circle cx="0" cy="0" r="43" stroke="#222842" stroke-width="1.5" fill="#0d101a" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="43" stroke="url(#badgeGrad)" stroke-width="1.5" fill="none" opacity="0.65"/>

    <!-- Counter-rotating Tech Orbitals -->
    <g class="spin-dashed">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="40.5" stroke="#00f5ff" stroke-width="1" stroke-dasharray="2 5" fill="none" opacity="0.45"/>
    </g>

    <!-- Rotating Typography Text Ring -->
    <g class="spin-text">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="6.2" font-weight="700" fill="#00f5ff" letter-spacing="1.3" opacity="0.95">
        <textPath href="#textCircle" xlink:href="#textCircle" startOffset="0%">
          • CONTINUOUS DEVELOPMENT • ACTIVE PIPELINE 
        </textPath>
      </text>
    </g>

    <!-- Inner Core Background with Pulsing Radar Ring -->
    <circle cx="0" cy="0" r="18" fill="#00f5ff" opacity="0.15">
      <animate attributeName="r" values="17;21;17" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="17" fill="#111422" stroke="#222842" stroke-width="1.5"/>

    <!-- Center Icon: Continuous Active Engineering Loop (Infinity / Pipeline Core) -->
    <g class="pulse-center">
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" repeatCount="indefinite"/>
      <path d="M-8.5 0C-8.5 -3.8 -5.5 -6 -2.8 -3.2C-1.3 -1.8 1.3 1.8 2.8 3.2C5.5 6 8.5 3.8 8.5 0C8.5 -3.8 5.5 -6 2.8 -3.2C1.3 -1.8 -1.3 1.8 -2.8 3.2C-5.5 6 -8.5 3.8 -8.5 0Z" fill="none" stroke="url(#coreGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="2" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>