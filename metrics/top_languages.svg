<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <defs>
    <linearGradient id="cardGradL" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1019"/>
      <stop offset="50%" stop-color="#131625"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <filter id="shadowL" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowCyanL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .f-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <rect width="495" height="195" rx="12" fill="url(#cardGradL)" stroke="#222842" stroke-width="1.2" filter="url(#shadowL)"/>

  <!-- Futuristic Corner Cyber-Reticles -->
  <path d="M 12 22 L 12 12 L 22 12" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 483 22 L 483 12 L 473 12" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 12 173 L 12 183 L 22 183" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 483 173 L 483 183 L 473 183" stroke="#00f5ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Title -->
  <g transform="translate(24, 28)">
    <rect x="0" y="-7" width="3" height="12" rx="1.5" fill="#00f5ff" filter="url(#glowCyanL)"/>
    <text x="12" y="3" fill="#70a5fd" class="f-mono" font-size="13" font-weight="700" letter-spacing="1">
      MOST USED LANGUAGES // POLYGLOT ECOSYSTEM
    </text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(25, 42)">
    <rect width="445" height="7" rx="3.5" fill="#1b1f33"/>
    <g clip-path="url(#barClip)">
      <defs>
        <clipPath id="barClip">
          <rect width="445" height="7" rx="3.5"/>
        </clipPath>
      </defs>
      
    </g>
  </g>

  <!-- Legend Columns -->
  <g transform="translate(25, 62)">
    
    
  </g>
</svg>