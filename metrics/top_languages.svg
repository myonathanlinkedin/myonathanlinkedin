<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <defs>
    <linearGradient id="cardGradL" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1019"/>
      <stop offset="50%" stop-color="#131625"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <filter id="shadowL" x="-5%" y="-5%" width="110%" height="110%">
